# Shared workstation toolchain. Bootstrap installs this globally; projects may override it.
# Commit mise.lock whenever changing these pins.
# min_version is also the mise bootstrap/bootstrap.sh installs on a machine
# that has none or an older one (a newer one is kept); the mise_*_sha256
# digests under [vars] move with it (bun bootstrap/pins.ts mise).
min_version = "2026.11.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]

[tool_alias]
# Upstream no longer builds Delta for Intel macOS. Conda-forge ships all five platforms.
delta = "conda:git-delta"

[tools]
gh = "2.106.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
opentofu = "1.13.10"
bun = "1.4.5"
node = "26.13.1"
atlas = { version = "1.4.0", os = ["linux", "macos"], lazy = true }
azure-cli = { version = "2.93.0", lazy = true }
# CLI proxy backups on the manager (cliproxy/scripts/install-dependencies).
restic = { version = "0.20.0", os = ["linux", "macos"], lazy = true }
# Replicates the fleet state database to the storage bucket (src/state).
litestream = { version = "0.5.18", os = ["linux", "macos"], lazy = true }
pnpm = "12.23.0"
"npm:@yarnpkg/cli-dist" = "4.19.0"
deno = "2.9.8"
python = "3.15.2"
uv = "0.13.10"
go = "1.27.4"
jq = "1.8.2"
yq = "4.54.3"
ripgrep = "16.0.0"
# Terminal multiplexer for long agent and build sessions on a worker.
tmux = { version = "3.8", os = ["linux", "macos"] }
fd = "10.5.2"
fzf = "0.75.0"
bat = "0.27.0"
delta = "0.23.0"
git-lfs = "3.8.1"
docker-cli = "29.10.1"
"npm:vercel" = "68.0.0"
"npm:wrangler" = "4.169.0"
railway = "5.75.0"
"aqua:anomalyco/opencode" = "1.19.6"
vault = "2.2.2"
claude = "2.1.332"
codex = "0.172.0"
gemini = { version = "0.71.1", allow_builds = ["@lydell/node-pty"] }
copilot = "1.0.114"
# Agent CLIs without a registry backend: exact vendor artifacts, checksums in mise.lock.
"http:grok" = { version = "1.0.92", bin = "grok", platforms = { linux-x64 = { url = "https://x.ai/cli/grok-{{version}}-linux-x86_64" }, linux-arm64 = { url = "https://x.ai/cli/grok-{{version}}-linux-aarch64" }, macos-x64 = { url = "https://x.ai/cli/grok-{{version}}-macos-x86_64" }, macos-arm64 = { url = "https://x.ai/cli/grok-{{version}}-macos-aarch64" } }, os = ["linux", "macos"] }
"http:antigravity" = { version = "1.5.18", bin = "antigravity", platforms = { linux-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/linux-x64/cli_linux_x64.tar.gz" }, linux-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/linux-arm/cli_linux_arm64.tar.gz" }, macos-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/darwin-x64/cli_mac_x64.tar.gz" }, macos-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/darwin-arm/cli_mac_arm64.tar.gz" } }, os = ["linux", "macos"] }
"http:cursor-agent" = { version = "2026.11.22-e9042b2", bin = "cursor-agent", bin_path = "dist-package", os = ["linux", "macos"], platforms = { linux-x64 = { url = "https://downloads.cursor.com/lab/{{version}}/linux/x64/agent-cli-package.tar.gz" }, linux-arm64 = { url = "https://downloads.cursor.com/lab/{{version}}/linux/arm64/agent-cli-package.tar.gz" }, macos-x64 = { url = "https://downloads.cursor.com/lab/{{version}}/darwin/x64/agent-cli-package.tar.gz" }, macos-arm64 = { url = "https://downloads.cursor.com/lab/{{version}}/darwin/arm64/agent-cli-package.tar.gz" } } }

"aws" = { version = "2.42.5", os = ["linux", "macos"] }
"rust" = "1.100.1"
"cmake" = "4.5.1"
"ninja" = "1.13.2"
"just" = "1.59.0"
"gitleaks" = "8.30.1"
"shfmt" = "3.14.1"
"sops" = "3.13.3"
"age" = "1.3.2"
"kubectl" = "1.37.3"
"helm" = "4.3.2"
"xh" = "0.26.3"
"usql" = "0.21.6"
"java" = { version = "temurin-25.0.5+8.0.LTS", lazy = true }
"dotnet" = { version = "10.0.403", lazy = true, lazy_bins = ["dotnet"] }
"gcloud" = { version = "591.0.0", lazy = true }
"npm:@devcontainers/cli" = "0.91.0"
# pino's 9.x backport was manually published; integrity and all published JS
# were checked against pinojs/pino v9.14.0. Keep the exception version-specific.
"npm:@modelcontextprotocol/inspector" = { version = "2.17.0", lazy = true, lazy_bins = ["mcp-inspector", "inspector", "mcpdo"], trust_policy_excludes = ["pino@9.14.0"] }
"aws-cdk" = { version = "2.1149.0", lazy = true }
"aws-sam" = { version = "1.174.1", lazy = true, os = ["linux", "macos"] }

# Keep self-updaters from bypassing the reviewed toolchain lock.
[env]
DISABLE_AUTOUPDATER = "1"
COPILOT_AUTO_UPDATE = "false"
GROK_DISABLE_AUTOUPDATER = "1"
# Antigravity ignores "1"; only "true" stops its in-place self-updater.
AGY_CLI_DISABLE_AUTO_UPDATE = "true"
# One package store per machine that every checkout links from instead of
# copying (docs/ubuntu-sync.md, Shared package stores). pnpm: one store-dir,
# auto import (hardlinks on ext4, clones on APFS), offline first. Bun keeps one
# cache and links from it by default (hardlink on Linux, clonefile on macOS).
# The disk GC measures both stores (disk-gc.py STORES).
pnpm_config_store_dir = "{{env.HOME}}/.local/share/pnpm/store"
pnpm_config_package_import_method = "auto"
pnpm_config_prefer_offline = "true"
BUN_INSTALL_CACHE_DIR = "{{env.HOME}}/.bun/install/cache"

[vars]
# mise itself, installed by bootstrap/bootstrap.sh before mise can read this
# file: the version is min_version above, these are its release archives
# (SHASUMS256.txt of that release).
mise_linux_x64_sha256 = "4b029e19afc575875a4962dfe5d5e31cc93ab0317242768d0234adec219d3e14"
mise_linux_arm64_sha256 = "9a125763f8445ea28d2da0e943fe5ad7d81b397d78f173cc07c1cc18ee2bee47"
mise_macos_x64_sha256 = "19c0e3dff9eddaab7a3519e9556be35580ade53b2bffb550f307343cb6b678ef"
mise_macos_arm64_sha256 = "f7bd19aa4e6b7a58d7296f98e2c6af68b2e2643dfd608b0bc46c2b5fdbc8749b"
# Official native server distribution (Ubuntu workers, and the manager's
# pinned CLI); bootstrap/native-t3.ts owns installation. From the release's SHA256SUMS.
t3_version = "0.1.14-nightly.20261128.5372"
t3_linux_x64_sha256 = "ed47136d5696a6933038d0a6716e60269c5030bb2b64fae277c13d8e9d1b3022"
t3_linux_arm64_sha256 = "9cb327604bd56ad997b6827913ad292010f7f66da171ce8a9b46392a0a0d3ba5"
t3_darwin_arm64_sha256 = "a760a18dc24a6c49aa77e37d5a11c199897eb77295feffd14da40efa0fde70b9"
# Official T3 Code desktop .deb (same release). Workers run this GUI app as their
# only T3 process; it embeds the server. Upstream SHA256SUMS omits .deb files,
# so these digests were computed from the release assets.
t3_desktop_darwin_arm64_sha256 = "7b3b7003cf4cf23e684437e34c5536b82a2d84319d335e08b32e4134b6b8f2a9"
t3_desktop_amd64_sha256 = "ada83b8c7991fe04889fd163b70c33b11098856e1ffae1dd72b9f2e03fdc1bab"
t3_desktop_arm64_sha256 = "ab899391c7174d6990efb0de9d68472a2fc93c3ecc937d915b5ab789f765e92a"
# Official AWS v2 Windows MSI, same version as tools.aws; checked before execution.
aws_windows_msi_sha256 = "65b82923074b154e3ec5375716b886e3c5bd5483714cc94ba1e67a04dfbb6715"
# Docker Desktop supplies the macOS engine, Compose and Buildx as one vendor bundle.
# Official release/checksums: https://docs.docker.com/desktop/release-notes/#4980
docker_desktop_version = "4.98.0"
docker_desktop_build = "245422"
docker_desktop_arm64_sha256 = "9c6f13ce4edda2abf20d801552b6acb96acd3d64b3e91b50c4484353802758b5"
docker_desktop_amd64_sha256 = "96b53f9a4a807b6be6207d18f360b9778ff481e1d94b5027bdf1ae2a22d837cb"

# Minimal remote development baseline; versions are resolved exclusively by tools + mise.lock.
worker_tools = "bun,node,gh,python,uv,docker-cli,vault,jq,tmux,codex,claude,aqua:anomalyco/opencode,gemini,copilot,http:grok,http:antigravity,http:cursor-agent"
# Tool profiles a fleet adds to its workers (`worker.toolProfiles` in
# fleet.json, fleet-wide or per worker): one `worker_profile_<name>` each,
# naming tools pinned above. bootstrap/worker-tools.ts lists the names.
worker_profile_web = "pnpm,deno,npm:@yarnpkg/cli-dist"
worker_profile_go = "go"
worker_profile_rust = "rust,cmake,ninja"
worker_profile_jvm = "java"
