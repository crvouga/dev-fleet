---
# Manager power policy. Workers depend on the manager's singleton services
# (CLI proxy, Beszel hub), so the manager never sleeps on AC power. Sleep on
# battery is left to the human. The settings are the `pmset` object in
# policy.json; fleet-sync measures the same object as manager:power. Changing
# them needs an administrator: ansible-playbook -K manager.yml
- name: Keep the fleet manager awake on AC power
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars_files:
    - policy.json
  tasks:
    - name: Inspect effective power management settings
      ansible.builtin.command:
        argv: [/usr/bin/pmset, -g, custom]
      changed_when: false
      register: pmset_custom
    - name: Apply the declared AC power settings
      ansible.builtin.command:
        argv: [/usr/bin/pmset, -c, '{{ item.key }}', '{{ item.value }}']
      loop: '{{ pmset | dict2items }}'
      loop_control:
        label: '{{ item.key }}'
      vars:
        ac_section: "{{ pmset_custom.stdout.split('AC Power:') | last }}"
        observed: "{{ ac_section | regex_findall('^\\s*' ~ item.key ~ '\\s+(\\S+)', multiline=True) | first | default('') }}"
      when: observed != item.value
      changed_when: true
