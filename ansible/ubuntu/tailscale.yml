---
- name: Converge native Tailscale without replacing its device identity
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  # fleet-repair re-applies this play alone for a failing tailscale:* check.
  tags: [network]
  # The approved version and the signing key's digest: `tailscale` in policy.json.
  vars_files:
    - policy.json
  tasks:
    - name: Require a supported Ubuntu release
      ansible.builtin.import_tasks: tasks/release.yml
    - name: Inspect installed packages before possible network interruption
      ansible.builtin.package_facts:
        manager: apt
    # The pin is a minimum: a newer Tailscale is kept and reported as a
    # warning by the worker checks; an older one needs a maintenance window.
    - name: Compare the installed Tailscale with its pin
      ansible.builtin.command:
        argv:
          - dpkg
          - --compare-versions
          - '{{ ansible_facts.packages.tailscale[0].version }}'
          - ge
          - '{{ tailscale.version }}'
      register: tailscale_pin
      changed_when: false
      failed_when: tailscale_pin.rc not in [0, 1]
      check_mode: false
      when: "'tailscale' in ansible_facts.packages"
    - name: Require maintenance for an upgrade to the pin
      ansible.builtin.assert:
        that: "'tailscale' not in ansible_facts.packages or tailscale_pin.rc == 0"
        fail_msg: TAILSCALE_UPGRADE_PENDING; upgrading an active VPN can disconnect SSH. Review an explicit maintenance operation.
    - name: Inspect existing package-source ownership before writing
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: ['*.list', '*.sources']
        contains: '.*pkgs.tailscale.com.*'
        read_whole_file: true
      register: existing_sources
    - name: Refuse duplicate or custom sources instead of breaking APT
      ansible.builtin.assert:
        that:
          - existing_sources.matched <= 1
          - existing_sources.matched == 0 or existing_sources.files[0].path == '/etc/apt/sources.list.d/tailscale.list'
        fail_msg: TAILSCALE_SOURCE_OWNER_CONFLICT; review the existing signed source and its migration before creating another repository entry.
    - name: Install pinned upstream signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_release.codename }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        checksum: 'sha256:{{ tailscale.keySha256 }}'
        owner: root
        group: root
        mode: '0644'
        timeout: 30
    - name: Declare the signed upstream package source
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ubuntu_release.codename }} main
        filename: tailscale
        state: present
        update_cache: false
      register: tailscale_source
    - name: Install the approved version only when absent
      ansible.builtin.apt:
        name: 'tailscale={{ tailscale.version }}'
        state: present
        update_cache: true
        cache_valid_time: 0
        lock_timeout: '{{ aptLockTimeoutSeconds }}'
        allow_downgrade: false
        allow_unauthenticated: false
      when: "'tailscale' not in ansible_facts.packages"
    - name: Enable and start the native daemon, preserving existing identity
      ansible.builtin.systemd_service:
        name: tailscaled.service
        enabled: true
        state: started
    - name: Inspect native authentication without prompting or opening a browser
      ansible.builtin.command:
        argv: [tailscale, status, '--json']
      changed_when: false
      check_mode: false
      failed_when: false
      register: tailscale_status
      no_log: true
    - name: Require genuine device authentication before claiming connectivity
      ansible.builtin.assert:
        that: (tailscale_status.stdout | from_json).BackendState == 'Running'
        fail_msg: TAILSCALE_LOGIN_REQUIRED; authorize this device through its native login. Existing state is never copied or reset.
      no_log: true
