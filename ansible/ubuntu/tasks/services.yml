---
# Always-on recovery for the system services every worker depends on. Drop-ins
# change restart policy only; running services are never restarted here.
- name: Create recovery drop-in directories for required system services
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.service.d'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ alwaysOnServices }}'
- name: Declare unlimited automatic restart for required system services
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item }}.service.d/60-personal-fleet.conf'
    owner: root
    group: root
    mode: '0644'
    backup: true
    content: |
      # Managed by personal fleet-sync: keep this worker service always on.
      [Unit]
      StartLimitIntervalSec=0
      [Service]
      Restart=always
      RestartSec=5
  loop: '{{ alwaysOnServices }}'
  register: recovery_dropins
- name: Reload unit definitions without restarting running services
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: recovery_dropins.changed
# A skewed clock breaks TLS, tokens, apt signatures and Vault logins with
# errors that never mention time. Ubuntu ships one time service (chrony on
# newer releases, systemd-timesyncd before); whichever is installed stays
# enabled. A container takes its clock from its host. Measured as worker:clock.
- name: Inspect the time services this worker has
  ansible.builtin.service_facts:
- name: Keep the clock synchronised with the time service Ubuntu ships
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: "{{ (['chrony.service', 'systemd-timesyncd.service'] | select('in', ansible_facts.services) | list)[:1] }}"
  when: ansible_facts.virtualization_type not in ['docker', 'container', 'podman', 'lxc', 'systemd-nspawn']
