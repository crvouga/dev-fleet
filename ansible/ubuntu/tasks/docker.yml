---
- name: Rotate container logs by default (new containers, after the next Docker restart)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    force: false
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "{{ resourceSafety.dockerLogMaxSize }}", "max-file": "{{ resourceSafety.dockerLogMaxFiles }}" }
      }
    validate: dockerd --validate --config-file %s
- name: Start the native Docker engine without restarting existing workloads
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
- name: Grant the designated developer access to the local Docker engine
  ansible.builtin.user:
    name: '{{ development_user }}'
    groups: docker
    append: true
- name: Verify native Docker Compose and Buildx installation
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [docker, compose, version]
    - [docker, buildx, version]
  changed_when: false
  # Verifies a change a dry run does not make.
  when: not ansible_check_mode
# The engine answering is not proof that an agent can use it: run a pinned
# image and build a one-line image as the developer, in a fresh session that
# reads the docker group from scratch. The image is cached here so the same
# test works offline in worker:docker-run.
- name: Look for the cached smoke-test image
  ansible.builtin.command:
    argv:
      [
        docker,
        image,
        inspect,
        --format,
        '{{ "{{.Id}}" }}',
        '{{ dockerSmokeTest.image }}',
      ]
  become: true
  become_user: '{{ development_user }}'
  check_mode: false
  changed_when: false
  failed_when: false
  register: docker_smoke_image
- name: Cache the pinned smoke-test image
  ansible.builtin.command:
    argv: [docker, pull, --quiet, '{{ dockerSmokeTest.image }}']
  become: true
  become_user: '{{ development_user }}'
  when: docker_smoke_image.rc | default(0) != 0
  changed_when: true
- name: Run a container as the developer, offline (DOCKER_RUN_FAILED)
  ansible.builtin.command:
    argv:
      [
        docker,
        run,
        --rm,
        --network,
        none,
        --pull,
        never,
        '{{ dockerSmokeTest.image }}',
        'true',
      ]
  become: true
  become_user: '{{ development_user }}'
  timeout: '{{ dockerSmokeTest.timeoutSeconds }}'
  changed_when: false
  # Verifies a change a dry run does not make.
  when: not ansible_check_mode
- name: Build a one-line image as the developer, offline (DOCKER_BUILD_FAILED)
  ansible.builtin.command:
    argv: [docker, build, --quiet, --pull=false, --network, none, '-']
    stdin: |
      FROM {{ dockerSmokeTest.image }}
      RUN true
  become: true
  become_user: '{{ development_user }}'
  timeout: '{{ dockerSmokeTest.timeoutSeconds }}'
  changed_when: false
  # Verifies a change a dry run does not make.
  when: not ansible_check_mode
