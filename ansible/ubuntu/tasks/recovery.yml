---
# The unit runs a copy installed outside every revision: a synced revision is
# pruned two syncs later, and the unit must not name a file that is gone.
- name: Create the directory of the installed recovery scripts
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/personal-fleet
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install the T3 recovery scripts outside the revision
  become: true
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/{{ item }}'
    dest: '/usr/local/lib/personal-fleet/{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - t3-health.sh
    - t3-idle.py
- name: Declare bounded recovery of the worker T3 desktop app
  ansible.builtin.copy:
    dest: '{{ development_home }}/.config/systemd/user/personal-worker-recovery.service'
    owner: '{{ development_user }}'
    mode: '0600'
    content: |
      # Managed by personal fleet-sync: ansible/ubuntu/t3-health.sh
      [Unit]
      Description=Keep the worker T3 desktop app running and responsive
      [Service]
      Type=oneshot
      ExecStart=/bin/sh /usr/local/lib/personal-fleet/t3-health.sh
      TimeoutStartSec=90
- name: Declare persistent service recovery checks
  ansible.builtin.copy:
    dest: '{{ development_home }}/.config/systemd/user/personal-worker-recovery.timer'
    owner: '{{ development_user }}'
    mode: '0600'
    content: |
      [Unit]
      Description=Check the worker T3 desktop app every minute
      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      Persistent=true
      [Install]
      WantedBy=timers.target
- name: Enable bounded T3 recovery without restarting active sessions
  become: true
  become_user: '{{ development_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
  ansible.builtin.systemd_service:
    scope: user
    name: personal-worker-recovery.timer
    daemon_reload: true
    enabled: true
    state: started
