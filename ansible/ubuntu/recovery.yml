---
- name: Enable recovery for an already verified T3 desktop app
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  # fleet-repair re-applies this play alone for worker:service-recovery.
  tags: [recovery]
  tasks:
    # t3_unit is t3code-headless.service on a headless worker.
    - name: Verify the T3 unit runs before adding any recovery trigger
      ansible.builtin.command:
        argv:
          [
            systemctl,
            --user,
            is-active,
            "{{ t3_unit | default('t3code-desktop.service') }}",
          ]
      become: true
      become_user: '{{ development_user }}'
      environment:
        XDG_RUNTIME_DIR: '/run/user/{{ development_uid }}'
      changed_when: false
      check_mode: false
    - name: Enable recovery
      ansible.builtin.import_tasks: tasks/recovery.yml
