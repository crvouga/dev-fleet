---
- name: Apply reviewed Ubuntu development-server policy
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - policy.json
  pre_tasks:
    - ansible.builtin.import_tasks: tasks/release.yml
    - name: Require an explicit non-root user
      ansible.builtin.assert:
        that:
          - development_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          - development_user != 'root'
        fail_msg: Unsupported user; name the non-root developer account.
    - name: Read the designated existing account
      ansible.builtin.getent:
        database: passwd
        key: '{{ development_user }}'
    - name: Refuse a different user identity or home
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[development_user][1] | int == development_uid | int
          - ansible_facts.getent_passwd[development_user][4] == development_home
    - ansible.builtin.import_tasks: tasks/dpkg.yml
    # Memory and disk safety must land even when the disk is nearly full.
    - ansible.builtin.import_tasks: tasks/resources.yml
    - name: Inspect capacity before package and service changes
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - '-c'
          - |
            import json, os
            print(json.dumps([{"path": p, "freeMiB": (v.f_bavail * v.f_frsize) // (1024 * 1024), "freeInodes": v.f_favail} for p in ['/', '/var', os.environ['FLEET_HOME']] for v in [os.statvfs(p)]]))
      environment:
        FLEET_HOME: '{{ development_home }}'
      changed_when: false
      register: capacity
    - name: Preserve management capacity instead of installing into an exhausted disk
      ansible.builtin.assert:
        that:
          - item.freeMiB >= minimumFreeDiskMiB
          - item.freeInodes >= minimumFreeInodes
        fail_msg: RESOURCE_CAPACITY_REQUIRED; inspect disk space and inodes on the reported filesystem. Preserve developer work; the disk GC removes only build output and caches, so what remains needs a person.
      loop: '{{ capacity.stdout | from_json }}'
    - name: Inspect installed packages
      ansible.builtin.package_facts:
        manager: apt
    - name: Preserve Docker installations owned by a different distribution
      ansible.builtin.assert:
        that: "'docker-ce' not in ansible_facts.packages and 'containerd.io' not in ansible_facts.packages"
        fail_msg: DOCKER_OWNER_CONFLICT; migrate the existing Docker owner explicitly before applying the Ubuntu-native baseline.
    - name: Inspect existing service ownership
      ansible.builtin.service_facts:
  tasks:
    - ansible.builtin.import_tasks: tasks/packages.yml
    - ansible.builtin.import_tasks: tasks/docker.yml
    - ansible.builtin.import_tasks: tasks/browser.yml
      when: "'web' in worker_tool_profiles | default([])"
    - ansible.builtin.import_tasks: tasks/services.yml
    - ansible.builtin.import_tasks: tasks/power.yml
    - ansible.builtin.import_tasks: tasks/user.yml
    - ansible.builtin.import_tasks: tasks/ssh.yml
    - ansible.builtin.import_tasks: tasks/credentials.yml
      when: development_source is defined
    - ansible.builtin.import_tasks: tasks/github.yml
      when: development_source is defined
