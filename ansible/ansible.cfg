# How Ansible reaches a machine over SSH. dev-fleet points ANSIBLE_CONFIG at
# this file for every run (src/platform/ansible.ts), so no ansible.cfg of the
# operator's or of the working directory changes it. The SSH options
# themselves (strict host-key checking, keepalives, connection attempts, the
# fleet-owned known_hosts, user and port) come from src/ssh-connection.ts
# through the inventory, the same list every direct session takes, so the two
# cannot drift. Playbooks that run on the machine itself use no SSH at all.
[defaults]
timeout = 10

[ssh_connection]
retries = 3
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
