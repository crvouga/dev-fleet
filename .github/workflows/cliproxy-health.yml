name: CLI proxy health
# The CLI proxy checked from off the manager, by GitHub. Call it from the
# repository that holds your fleet.json, with one `uses:` line;
# cliproxy/docs/health-workflow.example.yml is a complete caller with the
# three schedules and a manual dispatch:
#
#   permissions: { contents: read, id-token: write, issues: write }
#   jobs:
#     health:
#       uses: crvouga/dev-fleet/.github/workflows/cliproxy-health.yml@<release tag>
#       with: { profile: readiness }
#
# It needs no stored secret. Everything else comes from the caller's
# repository: the Vault address and the proxy endpoint from its fleet.json,
# a short-lived Vault token from GitHub's OIDC token (the Vault role
# `vault-role` names), and the checks themselves from the exact dev-fleet
# release its package.json pins.
on:
  workflow_call:
    inputs:
      profile:
        description: readiness is free; light is the hourly check; nightly is comprehensive; manual adds wrong-key probes and fault simulations.
        type: string
        default: readiness
      suite:
        description: Which declared checks to run (all, core or cursor).
        type: string
        default: all
      model:
        description: Optional single model id from cliproxy/models.json (partial runs never open or close the tracking issue).
        type: string
        default: ''
      check:
        description: Optional capability glob such as chat.tools or responses.*.
        type: string
        default: ''
      max-requests:
        description: Optional lower request budget for this run.
        type: string
        default: ''
      force-probe:
        description: Probe models even if they were rate limited recently.
        type: boolean
        default: false
      config:
        description: The fleet configuration, relative to the caller's repository.
        type: string
        default: fleet.json
      vault-role:
        description: The Vault JWT role GitHub's OIDC token logs in with; it only reads.
        type: string
        default: github-actions
      track-issues:
        description: Open, update and close one tracking issue in the caller's repository.
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  health:
    name: CLI proxy health (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: cliproxy-health-${{ github.repository }}-${{ inputs.profile }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Read the fleet configuration and install the pinned dev-fleet
        id: fleet
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -eu
          case "$PROFILE" in liveness | readiness | light | nightly | manual) ;; *)
            echo "::error::CLIPROXY_HEALTH_PROFILE_UNKNOWN: $PROFILE"; exit 1 ;;
          esac
          config="$GITHUB_WORKSPACE/$CONFIG"
          [ -f "$config" ] || { echo "::error::CLIPROXY_HEALTH_CONFIG_MISSING: no $CONFIG in this repository."; exit 1; }
          version=$(node -p "const p = require('./package.json'); (p.devDependencies || {})['@crvouga/dev-fleet'] || (p.dependencies || {})['@crvouga/dev-fleet'] || ''")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::CLIPROXY_HEALTH_RELEASE_UNPINNED: package.json must pin @crvouga/dev-fleet to an exact version."
            exit 1
          fi
          npm install --prefix "$RUNNER_TEMP/devfleet" --ignore-scripts --no-audit --no-fund --silent "@crvouga/dev-fleet@$version"
          vault=$(jq -er '.secrets.address' "$config")
          {
            echo "DEVFLEET_CONFIG=$config"
            echo "CLIPROXY_SCRIPTS=$RUNNER_TEMP/devfleet/node_modules/@crvouga/dev-fleet/cliproxy/scripts"
          } >> "$GITHUB_ENV"
          echo "vault=$vault" >> "$GITHUB_OUTPUT"
      - name: Install read-only backup client
        if: env.PROFILE == 'readiness'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends restic
      - name: Read-only Vault login using GitHub OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.fleet.outputs.vault }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ steps.fleet.outputs.vault }}
          exportToken: true
      - name: Verify endpoint and cloud recovery freshness
        if: env.PROFILE == 'readiness'
        run: python3 -B "$CLIPROXY_SCRIPTS/external-health.py"
      - name: Restore last-success and rate-limit state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: model-health-state.json
          key: cliproxy-model-health-state-${{ github.run_id }}
          restore-keys: cliproxy-model-health-state-
      - name: Validate every required model
        # Bounded spend: the profile's request/token budget, concurrency and timeouts come from models.json;
        # inference is never retried; a model rate limited recently is not probed again until its pause ends.
        # The client key is read in-process from Vault and never printed.
        if: ${{ !cancelled() }}
        env:
          MODEL: ${{ inputs.model }}
          CHECK: ${{ inputs.check }}
          MAX_REQUESTS: ${{ inputs.max-requests }}
          SUITE: ${{ inputs.suite }}
          FORCE_PROBE: ${{ inputs.force-probe }}
        run: |
          command=model-health
          fail_on=unhealthy
          case "$PROFILE" in nightly | manual) command=model-suite; fail_on=degraded ;; esac
          args=(--profile "$PROFILE" --suite "$SUITE" --fail-on "$fail_on"
            --output model-health-report --state model-health-state.json)
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ -n "$CHECK" ]; then args+=(--check "$CHECK"); fi
          if [ -n "$MAX_REQUESTS" ]; then args+=(--max-requests "$MAX_REQUESTS"); fi
          if [ "$FORCE_PROBE" = "true" ]; then args+=(--force-probe); fi
          set +e
          python3 -B "$CLIPROXY_SCRIPTS/model_health.py" "$command" "${args[@]}" > /dev/null
          code=$?
          if [ -f model-health-report/agent-brief.md ]; then cat model-health-report/agent-brief.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f model-health-report/model-health.md ]; then cat model-health-report/model-health.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $code
      - name: Save last-success and rate-limit state
        if: ${{ always() && hashFiles('model-health-state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: model-health-state.json
          key: cliproxy-model-health-state-${{ github.run_id }}
      - name: Keep structured report
        if: ${{ always() && hashFiles('model-health-report/model-health.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-health-${{ inputs.profile }}-${{ github.run_id }}
          path: model-health-report
          retention-days: 30
      - name: Track findings in one issue per scope
        # Opens or updates a single tracking issue in the caller's repository when the findings change, and
        # closes it when a full run is healthy. The body is the redacted agent brief: structure and numbers,
        # no prompts or keys.
        if: ${{ always() && inputs.track-issues && hashFiles('model-health-report/model-health.json') != '' && inputs.model == '' && inputs.check == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scope=live
          case "$PROFILE" in nightly | manual) scope=nightly ;; esac
          title="[ops] CLI proxy model health ($scope)"
          report=model-health-report/model-health.json
          status=$(jq -r .summary.status "$report")
          fingerprint=$(jq -r .summary.findings.fingerprint "$report")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ "$status" = unhealthy ] || [ "$status" = degraded ]; then
            {
              head -c 58000 model-health-report/agent-brief.md
              printf '\n\nRun: %s (artifact model-health-%s-%s)\n<!-- fingerprint: %s -->\n' "$RUN_URL" "$PROFILE" "$GITHUB_RUN_ID" "$fingerprint"
            } > model-health-report/issue.md
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file model-health-report/issue.md
            elif ! gh issue view "$number" --json body --jq .body | grep -q "fingerprint: $fingerprint"; then
              gh issue edit "$number" --body-file model-health-report/issue.md
              gh issue comment "$number" --body "Findings changed: $RUN_URL"
            fi
          elif [ "$status" = healthy ] && [ -n "$number" ]; then
            gh issue close "$number" --comment "Healthy again: $RUN_URL"
          fi
