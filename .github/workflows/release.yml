name: Release
on:
  # Every merge to main: once CI passes on it, publish the next version.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A hand-pushed vX.Y.Z tag (the bootstrap seed) still publishes that version.
  push:
    tags: ['v*']
permissions:
  contents: write
  # npm Trusted Publishing: the job proves who it is with a short-lived OIDC
  # token. No npm token is stored anywhere.
  id-token: write
# One release at a time. A newer merge waiting here releases everything since
# the last tag, so a skipped intermediate run loses nothing.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Choose the version, stamp it and the commit into the package, and pack it
  # once. Every later job tests or publishes this one tarball.
  pack:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
      commit: ${{ steps.pack.outputs.commit }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # A merge already passed CI; a hand-pushed tag has not been checked here.
      - if: github.event_name == 'push'
        run: bun run format && bun run tc && bun run lint && bun test
      - name: Choose the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(bun bootstrap/release-version.ts)
          fi
          name=$(node -p "require('./package.json').name")
          # A release that cannot be published fails the run: a skipped
          # release must never be reported as a success.
          if [ -n "$version" ] && ! npm view "$name" name >/dev/null 2>&1; then
            echo "::error::$name is not on npm yet: run \`bun run bootstrap\` once."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Pack the release
        id: pack
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The version lives in the tag; package.json keeps 0.0.0-development.
          npm version "$VERSION" --no-git-tag-version
          # The package says which commit it is: fleet-sync run from it
          # converges every machine to exactly this revision.
          npm pkg set gitHead="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/release"
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP/release" | tail -n 1)
          bun bootstrap/release-notes.ts > "$RUNNER_TEMP/release/notes.md"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
  # The packed tarball, installed in an empty directory the way a fleet
  # project installs it, runs on every supported Node. A broken bin path or a
  # file missing from the package fails here, before anything is published.
  smoke:
    needs: pack
    if: needs.pack.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.pack.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Install and run the packed release
        env:
          TARBALL: ${{ runner.temp }}/release/${{ needs.pack.outputs.tarball }}
          VERSION: ${{ needs.pack.outputs.version }}
          COMMIT: ${{ needs.pack.outputs.commit }}
        run: bun bootstrap/package-smoke.ts "$TARBALL" "$VERSION" "$COMMIT"
  # The real Ubuntu machine, for the commit being released.
  vm:
    needs: pack
    if: needs.pack.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/vm.yml
    with:
      ref: ${{ needs.pack.outputs.commit }}
  # A worker joining a self-hosted tailnet, for the commit being released.
  tailnet:
    needs: pack
    if: needs.pack.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/tailnet.yml
    with:
      ref: ${{ needs.pack.outputs.commit }}
  # Publish the tarball the jobs above passed, then tag. A re-run after a
  # failed tag push finds the version on npm, skips the publish and pushes
  # the tag.
  release:
    needs: [pack, smoke, vm, tailnet]
    if: needs.pack.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.pack.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Publish to npm
        env:
          NAME: ${{ needs.pack.outputs.name }}
          VERSION: ${{ needs.pack.outputs.version }}
          TARBALL: ${{ runner.temp }}/release/${{ needs.pack.outputs.tarball }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            npm publish "$TARBALL" --provenance --access public
          fi
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.pack.outputs.version }}
          NOTES: ${{ runner.temp }}/release/notes.md
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --notes-file "$NOTES" --verify-tag
