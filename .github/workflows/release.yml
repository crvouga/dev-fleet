name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  # npm Trusted Publishing: the job proves who it is with a short-lived OIDC
  # token. No npm token is stored anywhere.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run format && bun run tc && bun run lint && bun test
      # The tag is the version; package.json keeps 0.0.0-development.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm version "$version" --no-git-tag-version
            npm publish --provenance --access public
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
