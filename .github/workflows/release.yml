name: Release
on:
  # Every merge to main: once CI passes on it, publish the next version.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A hand-pushed vX.Y.Z tag (the bootstrap seed) still publishes that version.
  push:
    tags: ['v*']
permissions:
  contents: write
  # npm Trusted Publishing: the job proves who it is with a short-lived OIDC
  # token. No npm token is stored anywhere.
  id-token: write
# One release at a time. A newer merge waiting here releases everything since
# the last tag, so a skipped intermediate run loses nothing.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # A merge already passed CI; a hand-pushed tag has not been checked here.
      - if: github.event_name == 'push'
        run: bun run format && bun run tc && bun run lint && bun test
      - name: Choose the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(bun bootstrap/release-version.ts)
          fi
          name=$(node -p "require('./package.json').name")
          if [ -n "$version" ] && ! npm view "$name" name >/dev/null 2>&1; then
            echo "::warning::$name is not on npm yet: run \`bun run bootstrap\` once."
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # Publish, then tag: a re-run after a failed tag push finds the version
      # on npm, skips the publish and pushes the tag.
      - name: Publish to npm
        if: steps.version.outputs.version != ''
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            # The version lives in the tag; package.json keeps 0.0.0-development.
            npm version "$VERSION" --no-git-tag-version
            npm publish --provenance --access public
          fi
      - name: Tag and release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --generate-notes --verify-tag
