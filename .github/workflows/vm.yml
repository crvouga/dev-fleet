name: Ubuntu VM
# The real Ubuntu machine a container cannot be: systemd, reboot, the user
# session. ansible/ubuntu/tests/run-vm.ts runs it, and the same command
# reproduces a failure on any Linux amd64 machine with Docker and KVM. It runs
# weekly, by hand, and before every release (the Release workflow calls it for
# the commit it publishes and publishes nothing unless it passed).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: The commit to test
        type: string
        required: true
permissions:
  contents: read
jobs:
  vm:
    name: Ubuntu VM (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # GitHub's Linux runners have KVM; it is only not open to the runner's user.
      - name: Open KVM to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the VM test
        run: bun ansible/ubuntu/tests/run-vm.ts ${{ matrix.mode }}
      # The evidence of a failed run, for whoever fixes it: the redacted
      # results and the logs of the disposable guest. The fixture keys and
      # the guest's disks stay on the runner.
      - name: Keep the evidence of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-evidence-${{ matrix.mode }}
          path: |
            ~/.cache/fleet-vm-*/vm/*.json
            ~/.cache/fleet-vm-*/vm/*.log
          if-no-files-found: warn
          retention-days: 14
