name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The Python and restic every machine runs, from the same lock: never
      # the runner's own or the distribution's.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.24
          install_args: python restic
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          mise exec python -- python3 -m pip install --quiet --require-hashes -r cliproxy/requirements.lock
      - run: bun run format
      - run: bun run tc
      - run: bun run lint
      - run: mise exec python restic -- bun test
      - run: mise exec python restic -- bun run lint:cliproxy
      - run: mise exec python restic -- bun run test:cliproxy
  state:
    name: Fleet state
    # The pinned Litestream itself, replicating the fleet state to a directory
    # and to an S3 API, then restoring it on a second manager. The Check job
    # has no Litestream and skips these.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A throwaway S3 API. It accepts any credential, so this proves the
      # protocol and the layout in the bucket, not a provider's access rules.
      s3:
        image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        ports: ['5000:5000']
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # The version bootstrap/bootstrap.sh installs on every machine.
          version: 2026.10.24
          install_args: litestream
      - run: bun install --frozen-lockfile
      - name: Wait for the S3 service
        run: curl --silent --fail --retry 30 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:5000/
      - name: Replicate and restore the fleet state
        run: bun test features/state
        env:
          # A missing Litestream or S3 service fails here instead of skipping.
          DEVFLEET_TEST_LITESTREAM: required
          DEVFLEET_TEST_S3: http://127.0.0.1:5000
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.24
          # actionlint checks each `run:` script with the pinned shellcheck.
          install_args: actionlint shellcheck
      - run: mise exec actionlint shellcheck -- actionlint
  fresh-box:
    name: Fresh worker over SSH (${{ matrix.architecture }})
    # A disposable Ubuntu machine that has only an SSH server and an account
    # with sudo, bootstrapped by the production code over a real SSH
    # connection: features/fresh-box. It downloads the worker toolchain.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: amd64, runner: ubuntu-latest }
          - { architecture: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Bootstrap a fresh machine over SSH
        run: bun test features/fresh-box
        env:
          # A missing Docker or SSH client fails here instead of skipping.
          DEVFLEET_TEST_FRESH_BOX: required
  agent-box:
    name: Monitoring agent on systemd
    # The Beszel agent playbook applied for real on a disposable Ubuntu
    # machine running systemd: repeat runs, repaired drift, a cut-short
    # upgrade, its privileges and a restart. It downloads the pinned agent.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply the agent playbook on a systemd machine
        run: bun test features/monitoring
        env:
          DEVFLEET_TEST_AGENT_BOX: required
