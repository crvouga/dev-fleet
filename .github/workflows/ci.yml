name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          python3 -m pip install --quiet --require-hashes -r cliproxy/requirements.lock
          sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - run: bun run format
      - run: bun run tc
      - run: bun run lint
      - run: bun test
      - run: bun run lint:cliproxy
      - run: bun run test:cliproxy
  state:
    name: Fleet state
    # The pinned Litestream itself, replicating the fleet state to a directory
    # and to an S3 API, then restoring it on a second manager. The Check job
    # has no Litestream and skips these.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A throwaway S3 API. It accepts any credential, so this proves the
      # protocol and the layout in the bucket, not a provider's access rules.
      s3:
        image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        ports: ['5000:5000']
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: jdx/mise-action@v5
        with:
          # The version bootstrap/bootstrap.sh installs on every machine.
          version: 2026.10.24
          install_args: litestream
      - run: bun install --frozen-lockfile
      - name: Wait for the S3 service
        run: curl --silent --fail --retry 30 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:5000/
      - name: Replicate and restore the fleet state
        run: bun test tests/state tests/cli/fleet-state.test.ts tests/cli/fleet-sync-state.test.ts
        env:
          # A missing Litestream or S3 service fails here instead of skipping.
          DEVFLEET_TEST_LITESTREAM: required
          DEVFLEET_TEST_S3: http://127.0.0.1:5000
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          # actionlint checks each `run:` script with the pinned shellcheck.
          install_args: actionlint shellcheck
      - run: mise exec actionlint shellcheck -- actionlint
  fresh-box:
    name: Fresh box (opt-in)
    # Downloads the whole worker toolchain: run on demand or with the label.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'fresh-box')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun ansible/ubuntu/tests/fresh-box.ts
        env:
          DEVFLEET_CONFIG: ${{ github.workspace }}/examples/fleet.json
