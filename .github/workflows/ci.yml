name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          python3 -m pip install --quiet --require-hashes -r cliproxy/requirements.lock
          sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - run: bun run format
      - run: bun run tc
      - run: bun run lint
      - run: bun test
      - run: bun run lint:cliproxy
      - run: bun run test:cliproxy
  fresh-box:
    name: Fresh box (opt-in)
    # Downloads the whole worker toolchain: run on demand or with the label.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'fresh-box')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun ansible/ubuntu/tests/fresh-box.ts
        env:
          DEVFLEET_CONFIG: ${{ github.workspace }}/examples/fleet.json
