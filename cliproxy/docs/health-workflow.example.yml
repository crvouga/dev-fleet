name: CLI proxy health
# Copy this file into .github/workflows/ of the repository that holds your
# fleet.json, and name the dev-fleet release your package.json pins in the
# `uses:` line (RELEASE_TAG, such as v1.4.0). The checks are the reusable workflow
# .github/workflows/cliproxy-health.yml of dev-fleet; this file only says
# when they run. One workflow, five entry points, deliberately cheap by
# default:
#   every 15 min  readiness: free (no inference) + cloud checkpoint freshness
#   hourly        light: 2 tiny requests per model (about 200 requests a day)
#   03:41 nightly comprehensive suite (bounded by models.json budgets)
#   manual        any profile, one model or one check, optional force-probe
# The offline contract (no credentials, no inference) runs in dev-fleet's own
# CI, not here.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 * * * *'
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: readiness is free; light is the hourly check; nightly is comprehensive; manual adds wrong-key probes and fault simulations.
        type: choice
        default: light
        options: [liveness, readiness, light, nightly, manual]
      suite:
        description: Which declared checks to run.
        type: choice
        default: all
        options: [all, core, cursor]
      model:
        description: Optional single model id from cliproxy/models.json (partial runs never open or close the tracking issue).
        type: string
        default: ''
      check:
        description: Optional capability glob such as chat.tools or responses.* (cheap reproduction of one finding).
        type: string
        default: ''
      max_requests:
        description: Optional lower request budget for this run.
        type: string
        default: ''
      force_probe:
        description: Probe models even if they were rate limited recently (normally paused to protect quota).
        type: boolean
        default: false
# A short-lived Vault token from GitHub's OIDC token, and one tracking issue.
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  health:
    uses: crvouga/dev-fleet/.github/workflows/cliproxy-health.yml@RELEASE_TAG
    with:
      # Inference only on the hourly schedule; the 15-minute one is free.
      profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event.schedule == '41 3 * * *' && 'nightly' || github.event.schedule == '17 * * * *' && 'light' || 'readiness' }}
      suite: ${{ inputs.suite || 'all' }}
      model: ${{ inputs.model || '' }}
      check: ${{ inputs.check || '' }}
      max-requests: ${{ inputs.max_requests || '' }}
      force-probe: ${{ inputs.force_probe == true }}
